<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En-tête de lot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; padding: 12px 24px 0; background: #FFFFFF; border-bottom: 1px solid #E3E1DC; color: #1D1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<nav aria-label="Fil d'Ariane" style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #5E5B55">
<a href="Lots.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; color: #2B50C8; text-decoration: none; font-weight: 500">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 3 L5 7 L9 11" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"></path></svg>
Lots
</a>
<span aria-hidden="true">/</span>
<span aria-current="page" style="color: #1D1C1A">Camp de légionnaires</span>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.015em">Camp de légionnaires</h1>
<span style="padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: #F0EEEA; color: #3F3D38">Rome antique</span>
<a href="Styles.dc.html" style="padding: 3px 9px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #F0EEEA; color: #3F3D38; text-decoration: none">rome-stylise-v0</a>
<span style="font-size: 13px; color: #5E5B55">{{ stateLine }}</span>
<div style="margin-left: auto; display: flex; gap: 8px">
<button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; color: #1D1C1A; border: 1px solid #CFCCC5; font-size: 13.5px; font-weight: 500; cursor: pointer">Dupliquer le lot</button>
</div>
</div>
<nav aria-label="Étapes du lot" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
<a href="{{ s.href }}" aria-current="{{ s.current }}" style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; text-decoration: none; font-size: 14px; box-sizing: border-box; border-bottom: 2px solid {{ s.line }}; color: {{ s.fg }}; font-weight: {{ s.fw }}">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 600; box-sizing: border-box; background: {{ s.dotBg }}; color: {{ s.dotFg }}; border: 1px solid {{ s.dotBd }}">
<sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 L5 8.5 L9.5 3.5" style="fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg></sc-if>
<sc-if value="{{ s.notDone }}" hint-placeholder-val="{{ true }}">{{ s.n }}</sc-if>
</span>
{{ s.label }}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["brief","refs","gen","review"],"default":"review"},"$preview":{"width":1200,"height":190}}'>
class Component extends DCLogic {
  renderVals() {
    const order = ["brief", "refs", "gen", "review"];
    let cur = order.indexOf(this.props.step ?? "review");
    if (cur < 0) cur = 3;
    const DEF = [
      { label: "Brief", href: "Brief.dc.html" },
      { label: "Références", href: "Refs.dc.html" },
      { label: "Génération", href: "Generation.dc.html" },
      { label: "Revue", href: "Review.dc.html" }
    ];
    const steps = DEF.map((d, i) => {
      const done = i < cur;
      const on = i === cur;
      return {
        label: d.label,
        href: d.href,
        n: i + 1,
        done: done,
        notDone: !done,
        current: on ? "step" : "false",
        line: on ? "#2B50C8" : "transparent",
        fg: on ? "#2B50C8" : done ? "#1D1C1A" : "#5E5B55",
        fw: on ? 600 : 500,
        dotBg: done ? "#1F6B45" : on ? "#2B50C8" : "#FFFFFF",
        dotFg: done || on ? "#FFFFFF" : "#5E5B55",
        dotBd: done ? "#1F6B45" : on ? "#2B50C8" : "#BDB9B1"
      };
    });
    // L'app suit chaque objet séparément ; l'étape affichée est celle de l'objet le moins avancé.
    const STATE = [
      "8 objets · lancé le 9 oct.",
      "8 objets · 6 références choisies · 2 sans référence (import, réutilisation)",
      "8 objets · 3 prêts · 3 en cours · 1 relance · 1 réutilisé",
      "8 objets · 3 gardés · 4 à décider · 1 réutilisé"
    ];
    return { steps: steps, stateLine: STATE[cur] };
  }
}
</script>
</body>
</html>
