<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu principal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; padding: 14px 12px 20px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; color: #1D1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; text-decoration: none; color: #1D1C1A">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true" style="display: block"><path d="M14 3 L24 8.5 V19.5 L14 25 L4 19.5 V8.5 Z M4 8.5 L14 14 L24 8.5 M14 14 V25" style="fill: none; stroke: #1D1C1A; stroke-width: 1.6; stroke-linejoin: round"></path></svg>
<span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Atelier 3D</span>
</a>
<a href="Brief.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 8px; background: #2B50C8; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2 V12 M2 7 H12" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"></path></svg>
Nouveau lot
</a>
<nav aria-label="Menu principal">
<ul role="list" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<li><a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{ it.fg }}; background: {{ it.bg }}; font-weight: {{ it.fw }}">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span style="flex: 1 1 auto">{{ it.label }}</span>
<sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}">
<span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; text-align: center; box-sizing: border-box; background: {{ it.badgeBg }}; color: {{ it.badgeFg }}">{{ it.badge }}</span>
</sc-if>
</a></li>
</sc-for>
</ul>
</nav>
<section aria-labelledby="sb-cols">
<h2 id="sb-cols" style="margin: 0 0 4px; padding: 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5E5B55">Collections</h2>
<ul role="list" style="list-style: none; margin: 0; padding: 0">
<li><a href="Library.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: #1D1C1A"><span aria-hidden="true" style="width: 8px; height: 8px; flex: none; border-radius: 2px; background: #B5582E"></span><span style="flex: 1 1 auto">Camp de légionnaires</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5B55">8</span></a></li>
<li><a href="Library.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: #1D1C1A"><span aria-hidden="true" style="width: 8px; height: 8px; flex: none; border-radius: 2px; background: #9C7A54"></span><span style="flex: 1 1 auto">Vie du camp</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5B55">5</span></a></li>
<li><a href="Library.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; color: #1D1C1A"><span aria-hidden="true" style="width: 8px; height: 8px; flex: none; border-radius: 2px; background: #1F6B45"></span><span style="flex: 1 1 auto">Pack itch.io #1</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5B55">4</span></a></li>
</ul>
</section>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #ECEAE5">
<div style="padding: 12px; border-radius: 10px; background: #F5F4F1">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px"><span style="font-weight: 500">Crédits Meshy</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E5B55">426 / 1 000</span></div>
<div style="margin-top: 8px; height: 6px; border-radius: 999px; background: #E3E1DC; overflow: hidden"><div style="width: 43%; height: 100%; border-radius: 999px; background: #2B50C8"></div></div>
<div style="margin-top: 6px; font-size: 12px; color: #5E5B55">Renouvelés le 1er novembre</div>
</div>
<a href="Settings.dc.html" aria-current="{{ setCurrent }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ setBg }}; color: {{ setFg }}; font-weight: {{ setFw }}">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex: none"><path d="M9 6.5 A2.5 2.5 0 1 0 9 11.5 A2.5 2.5 0 1 0 9 6.5 Z M9 1.8 V4 M9 14 V16.2 M1.8 9 H4 M14 9 H16.2 M3.9 3.9 L5.5 5.5 M12.5 12.5 L14.1 14.1 M3.9 14.1 L5.5 12.5 M12.5 5.5 L14.1 3.9" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round"></path></svg>
Réglages
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","lots","library","generators","styles","settings"],"default":"home"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? "home";
    const TONE = { accent: ["#2B50C8", "#FFFFFF"], neutral: ["#F0EEEA", "#5E5B55"] };
    const DEF = [
      { k: "home", label: "Accueil", href: "Main.dc.html", icon: "M3 8.5 L9 3.5 L15 8.5 V15 H11 V11 H7 V15 H3 Z", badge: "", tone: "neutral" },
      { k: "lots", label: "Lots", href: "Lots.dc.html", icon: "M9 2.5 L16 6 L9 9.5 L2 6 Z M2 9.5 L9 13 L16 9.5 M2 12.5 L9 16 L16 12.5", badge: "3", tone: "accent" },
      { k: "library", label: "Bibliothèque", href: "Library.dc.html", icon: "M3 3 H8 V8 H3 Z M10 3 H15 V8 H10 Z M3 10 H8 V15 H3 Z M10 10 H15 V15 H10 Z", badge: "8", tone: "neutral" },
      { k: "generators", label: "Générateurs", href: "Generators.dc.html", icon: "M6.5 2.5 V6 M11.5 2.5 V6 M4 6 H14 V9 Q14 13 9 13 Q4 13 4 9 Z M9 13 V16", badge: "1", tone: "accent" },
      { k: "styles", label: "Styles", href: "Styles.dc.html", icon: "M9 2.5 Q15.5 2.5 15.5 8.5 Q15.5 11 13 11 H11.5 Q10 11 10.6 12.5 Q11.5 15.5 9 15.5 Q2.5 15.5 2.5 9 Q2.5 2.5 9 2.5 Z M6 7.5 L6 7.5 M9 5.5 L9 5.5 M12 7.5 L12 7.5", badge: "", tone: "neutral" }
    ];
    const items = DEF.map((d) => {
      const on = d.k === a;
      return {
        label: d.label,
        href: d.href,
        icon: d.icon,
        current: on ? "page" : "false",
        bg: on ? "#E8EDFB" : "transparent",
        fg: on ? "#2B50C8" : "#1D1C1A",
        fw: on ? 600 : 500,
        hasBadge: d.badge.length > 0,
        badge: d.badge,
        badgeBg: TONE[d.tone][0],
        badgeFg: TONE[d.tone][1]
      };
    });
    const setOn = a === "settings";
    return {
      items: items,
      setCurrent: setOn ? "page" : "false",
      setBg: setOn ? "#E8EDFB" : "transparent",
      setFg: setOn ? "#2B50C8" : "#1D1C1A",
      setFw: setOn ? 600 : 500
    };
  }
}
</script>
</body>
</html>
