<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lancer un banc d'essai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#E7E5E0}
a{color:#2B50C8}a:hover{color:#1E3A96}
button,input,textarea,select{font-family:inherit}
</style>
</helmet>
<div style="width: 760px; box-sizing: border-box; padding: 40px; background: #E7E5E0; color: #1D1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<div role="dialog" aria-labelledby="bench-title" style="background: #FFFFFF; border: 1px solid #DAD7D0; border-radius: 16px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; align-items: flex-start; gap: 12px; padding: 22px 24px 16px; border-bottom: 1px solid #ECEAE5">
<div style="flex: 1 1 auto; min-width: 0">
<h1 id="bench-title" style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Lancer un banc d'essai</h1>
<p style="margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; color: #5E5B55">Les deux générateurs fabriquent les mêmes objets, puis tu compares côte à côte. Le gagnant peut devenir le générateur par défaut.</p>
</div>
<a href="Generators.dc.html" aria-label="Fermer" style="width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #5E5B55; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"></path></svg></a>
</div>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="gen-a" style="font-size: 14px; font-weight: 500">Générateur A</label>
<select id="gen-a" defaultValue="meshy6" style="height: 44px; padding: 0 10px; border: 1px solid #CFCCC5; border-radius: 8px; font-size: 14px; background: #FFFFFF; color: #1D1C1A"><option value="meshy6">Meshy 6 · défaut actuel</option><option value="pixal">Pixal3D · ComfyUI</option><option value="trellis">Trellis.2 · ComfyUI</option></select>
<span style="font-size: 12.5px; color: #5E5B55">File Meshy · payant</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="gen-b" style="font-size: 14px; font-weight: 500">Générateur B</label>
<select id="gen-b" defaultValue="pixal" style="height: 44px; padding: 0 10px; border: 1px solid #CFCCC5; border-radius: 8px; font-size: 14px; background: #FFFFFF; color: #1D1C1A"><option value="pixal">Pixal3D · ComfyUI</option><option value="trellis">Trellis.2 · ComfyUI</option><option value="meshy6">Meshy 6 · défaut actuel</option></select>
<span style="font-size: 12.5px; color: #5E5B55">File carte graphique · gratuit</span>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 500">Objets de référence <span style="font-weight: 400; color: #5E5B55">· {{ count }} sur 5</span></legend>
<sc-for list="{{ objs }}" as="o" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 1px solid #E3E1DC; border-radius: 8px; cursor: pointer">
<input type="checkbox" checked="{{ o.on }}" onChange="{{ o.toggle }}" style="width: 18px; height: 18px; margin: 0; accent-color: #2B50C8">
<span style="flex: 1 1 auto; font-size: 14px">{{ o.name }}</span>
<span style="font-size: 12.5px; color: #5E5B55">{{ o.why }}</span>
</label>
</sc-for>
<button type="button" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; color: #1D1C1A; border: 1px solid #CFCCC5; font-size: 13.5px; font-weight: 500; cursor: pointer">Remplacer par un objet de la bibliothèque…</button>
</fieldset>
<label style="display: flex; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 10px; background: #F5F7FE; border: 1px solid #D9E0F7; cursor: pointer">
<input type="checkbox" checked="{{ reuse }}" onChange="{{ toggleReuse }}" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #2B50C8">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 500">Reprendre les derniers essais Meshy</span>
<span style="font-size: 13px; line-height: 1.45; color: #5E5B55">Les 5 objets ont déjà un essai Meshy 6 récent : le banc le réutilise. Décoche pour tout refabriquer.</span>
</span>
</label>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid #ECEAE5; background: #FAFAF8">
<span style="font-size: 14px; color: #1D1C1A">Coût : <strong style="font-weight: 600">{{ cost }}</strong></span>
<span style="flex: 1 1 auto"></span>
<a href="Generators.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14px; font-weight: 500; text-decoration: none; color: #5E5B55">Annuler</a>
<button type="button" disabled="{{ none }}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; background: {{ goBg }}; color: #FFFFFF; border: 0; font-size: 14px; font-weight: 600; cursor: pointer">Lancer le banc</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: [true, true, true, true, true], reuse: true };
  }
  renderVals() {
    const s = this.state;
    const LIST = [
      ["Amphore", "forme ronde, anses"],
      ["Chapiteau corinthien", "ornements fins"],
      ["Brasero en bronze", "ajouré, pieds fins"],
      ["Casque", "métal courbe"],
      ["Lampe à huile", "petite pièce"]
    ];
    const objs = LIST.map((it, i) => ({
      name: it[0], why: it[1], on: s.on[i],
      toggle: () => {
        const next = this.state.on.slice();
        next[i] = !next[i];
        this.setState({ on: next });
      }
    }));
    const count = s.on.filter(Boolean).length;
    const credits = s.reuse ? 0 : count * 30;
    return {
      objs: objs,
      count: count,
      reuse: s.reuse,
      toggleReuse: () => this.setState({ reuse: !this.state.reuse }),
      cost: credits === 0 ? "0 crédit Meshy · B tourne sur ta carte graphique" : credits + " crédits Meshy · B tourne sur ta carte graphique",
      none: count === 0,
      goBg: count === 0 ? "#9DB0E6" : "#2B50C8"
    };
  }
}
</script>
</body>
</html>
