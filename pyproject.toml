[project]
name = "atelier-3d"
version = "0.1.0"
description = "Application locale pour fabriquer une bibliothèque d'assets 3D de jeu"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "trimesh>=4.4",
  "pillow>=10",
  "python-multipart>=0.0.9",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools]
packages = ["api", "api.routes", "api.adapters", "api.services", "worker", "worker.handlers", "pipeline", "generators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
